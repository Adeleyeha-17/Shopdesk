<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
<meta name="theme-color" content="#ffffff">
<script>try{var t=localStorage.getItem('shopdesk-theme'),d=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');if(d)document.querySelector('meta[name="theme-color"]').setAttribute('content','#0d0e10')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<meta name="description" content="Order from the shop, pay in one transfer, and the shop sees your order straight away.">
<meta property="og:title" content="Order here">
<meta property="og:description" content="Pick what you want, then pay in one transfer.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ShopDesk">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<title>ShopDesk</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* the opening animation: the S draws itself, ShopDesk slides in, then it fades into the app (about 2 seconds) */
#sd-splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#fff;color:#101114;animation:sd-out .4s cubic-bezier(.65,0,.35,1) 1.75s forwards}
:root[data-theme="dark"] #sd-splash{background:#0d0e10;color:#f2f3f5}
#sd-splash .sd-in{display:flex;align-items:center}
#sd-splash .sd-logo{width:72px;height:72px;border-radius:21px;background:currentColor;display:grid;place-items:center;animation:sd-pop .35s cubic-bezier(.2,.8,.2,1) both}
#sd-splash svg{width:72px;height:72px}
#sd-splash path{fill:none;stroke:#fff;stroke-width:6.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:sd-draw .6s cubic-bezier(.65,0,.35,1) .2s forwards}
:root[data-theme="dark"] #sd-splash path{stroke:#0d0e10}
#sd-splash .sd-word{font:800 36px/1 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;max-width:0;opacity:0;margin-left:0;animation:sd-word .45s cubic-bezier(.65,0,.35,1) .8s forwards}
@keyframes sd-pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes sd-draw{to{stroke-dashoffset:0}}
@keyframes sd-word{to{max-width:200px;opacity:1;margin-left:14px}}
@keyframes sd-out{to{opacity:0;transform:scale(1.04);visibility:hidden}}
@media (prefers-reduced-motion:reduce){#sd-splash *{animation-duration:.01s!important;animation-delay:0s!important}#sd-splash{animation-delay:.6s}}
</style>
</head>
<body>
<div id="sd-splash" aria-hidden="true"><div class="sd-in"><div class="sd-logo"><svg viewBox="0 0 64 64"><path pathLength="1" d="M42.5 21.5C40.3 18 36.6 16.5 32.2 16.5C25.8 16.5 21.5 19.6 21.5 24.6C21.5 30 26.6 31.4 32 32.3C37.9 33.3 42.8 34.7 42.8 40.2C42.8 45.3 38.4 47.5 32.2 47.5C27.4 47.5 23.6 45.8 21.2 42.3"/></svg></div><div class="sd-word">ShopDesk</div></div></div>
<script>setTimeout(function(){var s=document.getElementById('sd-splash');if(s)s.remove()},matchMedia('(prefers-reduced-motion: reduce)').matches?1000:2200)</script>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
