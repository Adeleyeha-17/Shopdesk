name: Site

# Every push to main is tested, built and, after approval, published.
# Pull requests and other branches are tested and built only.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/db/run.sh
      # the money server function, against the database the step above left behind
      - run: npm ci --ignore-scripts
      - run: node tests/functions/money.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: database-test-output
          path: tests/db/out

  app:
    name: Browser tests
    runs-on: ubuntu-24.04
    # the official Playwright image already has the browser and everything it needs;
    # keep its version in step with the playwright entry in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run build:demo
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: tests/e2e/out

  build:
    name: Build the site
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_PRIVACY_EMAIL: ${{ vars.VITE_PRIVACY_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the build settings
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_PRIVACY_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done
          case "$VITE_SUPABASE_ANON_KEY" in
            sb_secret_*|*service_role*)
              echo "::error::VITE_SUPABASE_ANON_KEY must be the publishable key. The secret key never belongs in the site."
              exit 1 ;;
          esac

      - run: npm run build

      - name: Check the site points at the database
        run: |
          grep -qF "$VITE_SUPABASE_URL" dist/assets/*.js || { echo "::error::The build does not contain the Supabase URL."; exit 1; }
          test -f dist/.htaccess || { echo "::error::dist/.htaccess is missing."; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: shopdesk-site
          path: dist
          include-hidden-files: true
          retention-days: 30

  publish:
    name: Publish to shopdesk.com.ng
    needs: [database, app, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'ftp'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://shopdesk.com.ng
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: shopdesk-site
          path: dist

      - name: Upload to the web server
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
